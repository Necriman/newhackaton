####################################################################
# ZINVEST — LOCAL DEV (HTTPS via mkcert, Nginx + Gunicorn unix socket)
#
# Cert (trusted by the local mkcert CA):
#   deploy/nginx/certs/zinvest.loc.pem      (+ *.zinvest.loc)
#   deploy/nginx/certs/zinvest.loc-key.pem
# Regenerate with:
#   cd deploy/nginx/certs && \
#     mkcert -cert-file zinvest.loc.pem -key-file zinvest.loc-key.pem \
#            zinvest.loc "*.zinvest.loc"
#
# Symlink into Homebrew's nginx include dir:
#   ln -sf /Users/abdulaziz/Website/Zinvest/deploy/nginx/zinvest.loc.conf \
#          /opt/homebrew/etc/nginx/servers/zinvest.conf
#   nginx -t && nginx -s reload
#
# Gunicorn socket is created by deploy/run-backend.sh.
####################################################################

# ---- Shared upstream (Django via Gunicorn unix socket) ------------
upstream zinvest_django {
    server unix:/Users/abdulaziz/Website/Zinvest/backend/zinvest.sock;
}

# ---- Reusable proxy headers (X-Forwarded-Proto = https so Django knows) ----
# (kept inline per-location below; nginx has no "include vars" for a block set)

# ==================================================================
# 0. HTTP -> HTTPS redirect for every host (single source of truth).
# ==================================================================
server {
    listen 80;
    server_name zinvest.loc api.zinvest.loc dashboard.zinvest.loc;
    return 301 https://$host$request_uri;
}

# ==================================================================
# 1. MAIN — user-facing SPA + same-origin API/admin.
#    The Vue app (frontend/dist) calls a RELATIVE /api, so this host
#    must both serve the SPA and proxy /api + /admin to Gunicorn.
#    Users live at  https://zinvest.loc/app
# ==================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name zinvest.loc;

    ssl_certificate     /Users/abdulaziz/Website/Zinvest/deploy/nginx/certs/zinvest.loc.pem;
    ssl_certificate_key /Users/abdulaziz/Website/Zinvest/deploy/nginx/certs/zinvest.loc-key.pem;

    root /Users/abdulaziz/Website/Zinvest/frontend/dist;
    index index.html;

    client_max_body_size 200M;
    add_header X-Debug-Nginx "🟢 ZINVEST WEB" always;

    # Django-collected static (admin CSS/JS) + user media, served off disk.
    location /static/ { alias /Users/abdulaziz/Website/Zinvest/backend/staticfiles/; access_log off; expires 30d; }
    location /media/  { alias /Users/abdulaziz/Website/Zinvest/backend/media/;       access_log off; }

    # API + admin -> Gunicorn. Path is preserved EXACTLY (the refresh cookie is
    # scoped to /api/auth/refresh, so it must never be rewritten).
    location /api/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://zinvest_django;
    }

    # SPA history fallback LAST so it never shadows /api, /admin, /static, /media.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ==================================================================
# 2. API SUBDOMAIN — dedicated backend entry point (no SPA here).
#    https://api.zinvest.loc/api/...   and   https://api.zinvest.loc/admin/
# ==================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name api.zinvest.loc;

    ssl_certificate     /Users/abdulaziz/Website/Zinvest/deploy/nginx/certs/zinvest.loc.pem;
    ssl_certificate_key /Users/abdulaziz/Website/Zinvest/deploy/nginx/certs/zinvest.loc-key.pem;

    client_max_body_size 200M;
    add_header X-Debug-Nginx "🔵 ZINVEST API" always;

    location /static/ { alias /Users/abdulaziz/Website/Zinvest/backend/staticfiles/; access_log off; expires 30d; }
    location /media/  { alias /Users/abdulaziz/Website/Zinvest/backend/media/;       access_log off; }

    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://zinvest_django;
    }
}

# ==================================================================
# 3. DASHBOARD SUBDOMAIN — placeholder for a future admin dashboard.
#    Right now it just exposes the Django admin over its own host.
#    Later: point `root` at a separate dashboard build and proxy only
#    /api + /admin, mirroring block 1.
#    https://dashboard.zinvest.loc/admin/
# ==================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name dashboard.zinvest.loc;

    ssl_certificate     /Users/abdulaziz/Website/Zinvest/deploy/nginx/certs/zinvest.loc.pem;
    ssl_certificate_key /Users/abdulaziz/Website/Zinvest/deploy/nginx/certs/zinvest.loc-key.pem;

    client_max_body_size 200M;
    add_header X-Debug-Nginx "🟣 ZINVEST DASHBOARD" always;

    location /static/ { alias /Users/abdulaziz/Website/Zinvest/backend/staticfiles/; access_log off; expires 30d; }
    location /media/  { alias /Users/abdulaziz/Website/Zinvest/backend/media/;       access_log off; }

    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://zinvest_django;
    }
}
